[project]
name = "fileflow_agent"
version = "0.5.2"
description = "Scheduled file transfer agent for Local, SFTP, S3 (AWS / DO Spaces / R2 / MinIO), and HDFS (hadoopcli or WebHDFS) — with a web dashboard, processing pipeline, and dedup tracking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv",
    "pydantic",
    "pydantic-settings",
    "PyYAML",
    "apscheduler",
    "fastapi",
    "uvicorn",
    "paramiko",
    "boto3",
    "hdfs",
    "requests",
    "requests-kerberos"
]

[project.scripts]
fileflow = "fileflow_agent.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fileflow_agent" = ["static/*", "static/**/*"]
