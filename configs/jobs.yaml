jobs:
  - job_id: test_imran
    enabled: true
    schedule: "* * * * *"

    source:
      type: local
      path: /Users/imran/sftp_test
      file_pattern: "*.txt"

    destination:
      type: sftp
      path: /root/destination_sftp
      connection:
        host: 82.112.227.158
        port: 22
        username: root
        password: "123456"

    processing:
      enabled: false

    backup:
      enabled: true
      location: /Users/imran/backup
      retention_days: 2

    verification:
      method: size_match

  # Local -> HDFS upload via the production-friendly CLI transport.
  # Equivalent shell session per file:
  #   kinit -kt /home/sentinel/sentinel.kt sentinel@EXAMPLE.COM
  #   hadoopcli
  #   > copyFromLocal /var/tmp/<file> /external/nextapp/eventlog
  #   > exit
  # The connector handles kinit automatically (refreshes the ticket on every
  # upload) using the principal+keytab below.
  - job_id: local_to_bigdata
    enabled: false
    schedule: "*/5 * * * *"

    source:
      type: local
      path: /var/tmp
      file_pattern: "*.gz"

    destination:
      type: hdfs
      path: /external/nextapp/eventlog
      connection:
        transport: cli                                  # default; reads core-site.xml from host
        principal: "sentinel@EXAMPLE.COM"               # kinit -kt <keytab> <principal>
        keytab: "/home/sentinel/sentinel.kt"
        krb5ccname: "FILE:/tmp/krb5cc_sentinel"         # optional ticket cache override
        hadoop_cli: hadoopcli                           # binary; default if omitted
        overwrite: true                                 # rm -skipTrash, then copyFromLocal

    verification:
      method: size_match

  # Same upload via the WebHDFS REST transport — useful when this host doesn't
  # have a Hadoop client installed but can reach the namenode + datanodes over HTTPS.
  - job_id: local_to_bigdata_webhdfs
    enabled: false
    schedule: "*/5 * * * *"

    source:
      type: local
      path: /var/tmp
      file_pattern: "*.gz"

    destination:
      type: hdfs
      path: /external/nextapp/eventlog
      connection:
        transport: webhdfs                              # opt-in REST mode
        namenode: "https://st-c01r01-m03.bigdata.domain_example.com:9871"
        kerberos: true                                  # --negotiate -u :
        verify_ssl: false                               # -k
        overwrite: true                                 # op=CREATE&overwrite=true

    verification:
      method: size_match

  # Local -> S3-compatible (DigitalOcean Spaces) upload.
  # The .s3cfg-equivalent fields:
  #   access_key       -> connection.access_key       (leave blank to use AWS_ACCESS_KEY_ID env)
  #   secret_key       -> connection.secret_key       (PREFER env: AWS_SECRET_ACCESS_KEY)
  #   host_base+https  -> connection.endpoint_url     (omit for vanilla AWS S3)
  #   bucket_location  -> connection.region
  - job_id: local_to_do_spaces
    enabled: false
    schedule: "*/10 * * * *"

    source:
      type: local
      path: /var/tmp
      file_pattern: "report-*.csv"

    destination:
      type: s3
      path: incoming/reports        # key prefix; final key = "incoming/reports/<file>"
      connection:
        endpoint_url: "https://nyc3.digitaloceanspaces.com"
        region: nyc3
        bucket: my-space-name
        # access_key + secret_key intentionally omitted: read from env
        # access_key: "DO00..."   # only inline for dev/testing
        # secret_key: "..."       # NEVER commit real secrets
        verify_ssl: true
        # addressing_style: path  # uncomment for MinIO / older servers

    verification:
      method: size_match

