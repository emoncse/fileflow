jobs:
  - job_id: test_imran
    enabled: true
    schedule: "* * * * *"

    source:
      type: local
      path: /Users/imran/sftp_test
      file_pattern: "*.txt"

    destination:
      type: sftp
      path: /root/destination_sftp
      connection:
        host: 82.112.227.158
        port: 22
        username: root
        password: "123456"

    processing:
      enabled: false

    backup:
      enabled: true
      location: /Users/imran/backup
      retention_days: 2

    verification:
      method: size_match

  # Local -> WebHDFS upload, equivalent to:
  #   curl -L -k --negotiate -u : -X PUT -T <local> \
  #     "https://st-c01r01-m03.bigdata.domain_example.com:<port>/webhdfs/v1/external/nextapp/eventlog/<file>?op=CREATE&overwrite=true"
  # Requires `kinit` to have placed a valid ticket in the cache before the job runs.
  - job_id: local_to_bigdata
    enabled: false
    schedule: "*/5 * * * *"

    source:
      type: local
      path: /var/tmp
      file_pattern: "test-*.txt"

    destination:
      type: hdfs
      path: /external/nextapp/eventlog
      connection:
        namenode: "https://st-c01r01-m03.bigdata.domain_example.com:9871"
        kerberos: true        # --negotiate -u :
        verify_ssl: false     # -k
        overwrite: true       # op=CREATE&overwrite=true

    verification:
      method: size_match

